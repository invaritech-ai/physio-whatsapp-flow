[project]
name = "movement-whatsapp-automation-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "alembic",
    "twilio",
    "requests",
    "python-dotenv",
    "apscheduler",
    "python-multipart",
    "pydantic-settings",
    "email-validator",
    "psycopg[binary]",
    "PyJWT[crypto]",
    "celery[redis]",
    "redis",
    "slowapi",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]
