[pytest]
# Add project root to Python path so pytest can find app module
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    no_s3_mock: skip the autouse S3 upload mock (for testing real S3 logic)

# Output options
addopts = -v --tb=short
